<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Broadcast Monitor</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23667085'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="bar" class="bar lvl-stale" aria-live="polite">
    <div class="bar-main">
      <div id="bar-icon" class="bar-icon" aria-hidden="true">…</div>
      <div class="bar-text">
        <div id="headline" class="headline">Connecting to monitor…</div>
        <div id="detail" class="detail"></div>
      </div>
    </div>
    <div class="bar-side">
      <div id="onair" class="onair">OFF AIR</div>
      <div id="clock" class="clock">--:--:--</div>
    </div>
  </header>

  <div id="issues" class="issues" hidden></div>

  <nav class="toolbar">
    <span id="station" class="station">Broadcast Monitor</span>
    <span class="spacer"></span>
    <span id="notify-info" class="muted small"></span>
    <button id="btn-test" type="button" class="btn subtle" title="Send a test alert to every enabled channel">Test alert</button>
    <button id="btn-silence" type="button" class="btn subtle" hidden>Silence alarm</button>
    <button id="btn-sound" type="button" class="btn subtle" aria-pressed="false">🔇 Sound off</button>
  </nav>

  <main id="cards" class="grid"></main>

  <section class="card log-card">
    <header class="card-head"><span class="dot lvl-idle"></span><h2>Event log</h2><span id="log-note" class="status muted">newest first</span></header>
    <ol id="log" class="log"></ol>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
